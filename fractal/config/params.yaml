      width across the 62 clean stock/ETF edges available (only the ROC-of-1mo-volume
      form hinted at signal, +0.26 within-ticker, n=25). Needs single-stock ranges
      over many high-volume-variation days to confirm. Do not use as default; hedgeye_anchor
      (plain sigma) reconstructs Hedgeye better.
